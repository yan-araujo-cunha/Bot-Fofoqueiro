name: CTF Notify

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      teste:
        description: "Só mandar mensagem de teste"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ctf-notify
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar bot
        env:
          CTF_URL: ${{ secrets.CTF_URL }}
          CTF_TOKEN: ${{ secrets.CTF_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python ctf_notify.py ${{ inputs.teste && '--teste' || '' }}

      - name: Salvar estado
        run: |
          git config user.name "ctf-bot"
          git config user.email "ctf-bot@users.noreply.github.com"
          git add seen.json || true
          git diff --staged --quiet || (git commit -m "atualiza estado" && git push)
